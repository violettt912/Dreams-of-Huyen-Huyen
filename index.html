<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Những giấc mơ của Huyên Huyên 🌙✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }
        .dreamy-bg {
            background: linear-gradient(135deg, #fdf4ff 0%, #f3e8ff 50%, #fae8ff 100%);
        }
    </style>
</head>
<body class="dreamy-bg text-purple-950 min-h-screen flex flex-col justify-between selection:bg-purple-300 selection:text-purple-900">

    <!-- ================= PHẦN 1: MÀN HÌNH CHỜ FULL MÀN HÌNH ================= -->
    <div id="splash-screen" class="fixed inset-0 z-50 dreamy-bg flex flex-col justify-between items-center py-12 px-6 transition-opacity duration-700">
        
        <!-- Tiêu đề nhỏ phía trên -->
        <div class="text-center space-y-2 animate-bounce">
            <span class="inline-block bg-pink-100 text-pink-700 text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider shadow-sm">
                ✨ Trạm dừng chân mộng mơ
            </span>
        </div>

        <!-- Phần hình ảnh chính giữa (Full & To rõ) -->
        <div class="text-center space-y-6 my-auto">
            <div class="relative inline-block">
                <!-- Hiệu ứng hào quang mờ ảo phía sau ảnh -->
                <div class="absolute -inset-2 bg-purple-300/50 rounded-full blur-xl animate-pulse"></div>
                
                <!-- Hình ảnh hiển thị (Bạn thay link ảnh vào src="") -->
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                     alt="Huyên Huyên's Dream"
                     class="relative w-56 h-56 sm:w-64 sm:h-64 md:w-80 md:h-80 rounded-full mx-auto shadow-2xl border-4 border-white/80 object-cover transform transition-transform duration-500 hover:scale-105">
            </div>

            <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-purple-900 tracking-wide drop-shadow-sm">
                Những giấc mơ của Huyên Huyên
            </h1>
        </div>

        <!-- Nút bấm và lời nhắn phía dưới -->
        <div class="text-center space-y-4 w-full max-w-md">
            <button onclick="enterDream()"
               class="w-full group cursor-pointer inline-flex items-center justify-center gap-3 px-8 py-4 text-base md:text-lg font-extrabold text-purple-950 bg-white/80 backdrop-blur-md rounded-full shadow-lg border border-purple-200 hover:bg-purple-200 hover:shadow-xl hover:-translate-y-1 transition duration-300 ease-in-out focus:outline-none">
                <span class="text-xl group-hover:rotate-12 transition duration-300">💜</span>
                Hãy vào giấc mơ của Huyên Huyên thôi
                <span class="text-xl group-hover:-rotate-12 transition duration-300">✨</span>
            </button>

            <p class="text-xs md:text-sm text-purple-800/80 animate-pulse">Chạm nhẹ để bắt đầu hành trình kỳ diệu nhé! ✨</p>
            
            <footer class="pt-4 text-xs text-purple-700/70">
                <p>Những giấc mơ của Huyên Huyên © 2026</p>
            </footer>
        </div>
    </div>


    <!-- ================= PHẦN 2: TRANG CHỦ CHÍNH (ẨN ĐẾN KHI BẤM NÚT) ================= -->
    <div id="main-website" class="hidden flex flex-col min-h-screen justify-between">
        
        <!-- Header / Navigation -->
        <header class="w-full bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-purple-100 shadow-sm">
            <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
                <a href="#" class="text-lg md:text-xl font-extrabold text-purple-800 flex items-center gap-2">
                    <span>🌙</span> Những giấc mơ của Huyên Huyên
                </a>
                <nav class="flex gap-4 md:gap-6 font-semibold text-sm md:text-base text-purple-700">
                    <a href="#about" class="hover:text-purple-500 transition">Giới thiệu</a>
                    <a href="#gallery" class="hover:text-purple-500 transition">Gallery</a>
                    <a href="#diary" class="hover:text-purple-500 transition">Nhật ký</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-6 py-10 flex-grow w-full space-y-16">

            <!-- Hero Section -->
            <section id="about" class="flex flex-col md:flex-row items-center gap-8 bg-white/90 backdrop-blur-sm p-8 rounded-[2.5rem] shadow-sm border border-purple-200/60 relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 text-9xl opacity-10 select-none">✨</div>
                
                <div class="w-36 h-36 rounded-full bg-gradient-to-tr from-purple-200 via-pink-200 to-purple-300 overflow-hidden flex-shrink-0 border-4 border-white shadow-md flex items-center justify-center text-5xl">
                    🧸
                </div>
                <div class="text-center
