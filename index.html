<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng đến với Những giấc mơ của Huyên Huyên 🌙✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Nền mộng mơ giống trang chính */
            background: linear-gradient(135deg, #fdf4ff 0%, #f3e8ff 50%, #fae8ff 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center selection:bg-purple-300 selection:text-purple-900 p-4">

    <!-- Container chính cho màn hình chờ, bo tròn mềm mại -->
    <div class="text-center p-10 md:p-16 bg-white/90 backdrop-blur-sm rounded-[2.5rem] shadow-2xl border border-purple-200/60 max-w-3xl w-full mx-6 transition-all duration-500 ease-in-out hover:shadow-purple-200/50">

        <!-- Hình ảnh màn hình chờ -->
        <!-- CHÚ Ý: THAY THẾ LINK TRONG src="" BẰNG LINK ẢNH THỰC TẾ CỦA BẠN -->
        <img src="LINK_ANH_CUA_BAN_VAO_DAY"
             alt="Huyên Huyên's Dream"
             class="w-64 h-64 md:w-80 md:h-80 rounded-full mx-auto mb-12 shadow-xl border-4 border-white object-cover transform transition-transform duration-500 hover:scale-105"
             onerror="this.onerror=null;this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png';">
             <!-- Dòng onerror ở trên chỉ là dự phòng, nếu link ảnh của bạn lỗi, nó sẽ hiện icon gấu bông -->

        <!-- Nút ấn điều hướng chính xác -->
        <a href="main.html"
           class="group inline-flex items-center gap-4 px-10 py-5 text-lg md:text-xl font-extrabold text-purple-950 bg-purple-200/80 backdrop-blur-sm rounded-full shadow-lg hover:bg-purple-300/90 hover:shadow-xl hover:-translate-y-1.5 transition duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-purple-300/50 active:scale-95">
            <span class="text-2xl md:text-3xl group-hover:rotate-12 transition duration-300">💜</span>
            Hãy vào giấc mơ của Huyên Huyên thôi
            <span class="text-2xl md:text-3xl group-hover:-rotate-12 transition duration-300">✨</span>
        </a>

         <p class="mt-6 text-sm md:text-base text-purple-800/80 animate-pulse">Chạm nhẹ để bắt đầu hành trình kỳ diệu nhé! ✨</p>

    </div>

    <!-- Footer nhỏ -->
    <footer class="absolute bottom-6 w-full text-center text-xs text-purple-700/90">
        <p>Những giấc mơ của Huyên Huyên © 2026 • Thế giới của sự bình yên và dễ thương</p>
    </footer>

</body>
</html>
